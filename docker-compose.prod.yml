services:
# frontend 
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      target: production
      args:
        VITE_BASE_URL: ${VITE_BASE_URL:-http://localhost:8000/api/}
        VITE_URL_IMG: ${VITE_URL_IMG:-http://localhost:8000/storage/}
        VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:-brxbyvwk5tegqzjdn66u}
        VITE_REVERB_HOST: ${REVERB_HOST:-localhost}
        VITE_REVERB_PORT: ${REVERB_PORT:-8080}
        VITE_REVERB_SCHEME: ${REVERB_SCHEME:-http}
    container_name: phone_client_prod
    restart: always
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - webserver
    networks:
      - phone-network

#  backend
  webserver:
    image: nginx:alpine
    container_name: phone_nginx_prod
    restart: always
    ports:
      - "${BACKEND_PORT:-8000}:80"
    volumes:
      - ./Server/public:/var/www/public:ro
      - ./Server/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - laravel_storage:/var/www/storage:ro
    depends_on:
      - app
    networks:
      - phone-network


  app:
    build:
      context: ./Server
      dockerfile: Dockerfile
      target: production
    image: phone-backend-prod:latest
    container_name: phone_app_prod
    restart: always
    env_file:
      - path: .env
        required: false
    volumes:
      - laravel_storage:/var/www/storage
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-web-phone}
      - DB_USERNAME=${DB_USERNAME:-phone_user}
      - DB_PASSWORD=${DB_PASSWORD:-secure_prod_password}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - BROADCAST_CONNECTION=reverb
      - CACHE_STORE=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - phone-network


  reverb:
    build:
      context: ./Server
      dockerfile: Dockerfile
      target: production
    image: phone-backend-prod:latest
    container_name: phone_reverb_prod
    restart: always
    env_file:
      - path: .env
        required: false
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "${REVERB_PORT:-8080}:8080"
    environment:
      - APP_ENV=production
      - REVERB_SERVER_HOST=0.0.0.0
      - REVERB_SERVER_PORT=8080
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - app
    networks:
      - phone-network


  mysql:
    image: mysql:8.0
    container_name: phone_mysql_prod
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-web-phone}
      MYSQL_USER: ${DB_USERNAME:-phone_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secure_prod_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-very_secure_root_password}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - phone-network

  redis:
    image: redis:alpine
    container_name: phone_redis_prod
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - phone-network

networks:
  phone-network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  laravel_storage:

