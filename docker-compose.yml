services:
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      target: dev
    container_name: phone_client
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - /app/node_modules
    environment:
      - VITE_BASE_URL=http://localhost:8000/api/
      - VITE_URL_IMG=http://localhost:8000/storage/
      - VITE_REVERB_APP_KEY=brxbyvwk5tegqzjdn66u
      - VITE_REVERB_HOST=localhost
      - VITE_REVERB_PORT=8080
      - VITE_REVERB_SCHEME=http
    depends_on:
      - webserver
    networks:
      - phone-network

  webserver:
    image: nginx:alpine
    container_name: phone_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./Server:/var/www
      - ./Server/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - phone-network

  app:
    build:
      context: ./Server
      dockerfile: Dockerfile
      target: production
    image: phone-backend:latest
    container_name: phone_app
    restart: unless-stopped
    volumes:
      - ./Server:/var/www
      - /var/www/vendor
      - /var/www/bootstrap/cache
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=web-phone
      - DB_USERNAME=root
      - DB_PASSWORD=secret_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - mysql
      - redis
    networks:
      - phone-network

  reverb:
    build:
      context: ./Server
      dockerfile: Dockerfile
      target: production
    image: phone-backend:latest
    container_name: phone_reverb
    restart: unless-stopped
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "8080:8080"
    volumes:
      - ./Server:/var/www
      - /var/www/vendor
    environment:
      - REVERB_SERVER_HOST=0.0.0.0
      - REVERB_SERVER_PORT=8080
    depends_on:
      - app
    networks:
      - phone-network

  mysql:
    image: mysql:8.0
    container_name: phone_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: web-phone
      MYSQL_ROOT_PASSWORD: secret_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - phone-network

  redis:
    image: redis:alpine
    container_name: phone_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - phone-network

networks:
  phone-network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
